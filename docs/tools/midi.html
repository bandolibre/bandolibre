<!doctype html>
<!-- The configuration tool moved to ../connect/. This page only forwards old
     links and bookmarks there (sw.js next to it removes the old offline copy). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../connect/">
  <link rel="canonical" href="../connect/">
  <title>Bandolibre MIDI Connect</title>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((r) => { if (r.scope.endsWith("/tools/")) r.unregister(); }))
        .catch(() => {});
    }
    location.replace("../connect/" + location.search + location.hash);
  </script>
</head>
<body>
  <p>The Bandolibre configuration tool has moved: <a href="../connect/">open it here</a>.</p>
</body>
</html>
